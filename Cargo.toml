[package]
name = "rapidgate"
# 注：cargo semver 不接受 minor 段前导零，spec AGENTS.md §6 写 "2026.06.1" 会在
# `cargo check` 时报 "invalid leading zero"。这里用 2026.6.1 与 2026.6.x 系列等价。
# 待阶段二与用户对齐后决定是否回填 AGENTS.md。
version = "2026.6.1"
edition = "2021"
license = "Apache-2.0"
description = "High-performance unified LLM API gateway written in Rust"
repository = "https://github.com/SharkMI-0x7E/RapidGate"

[lib]
name = "rapidgate"
path = "src/lib.rs"

[[bin]]
name = "rapidgate"
path = "src/main.rs"

[dependencies]
# 异步运行时（spec §3.1 锁定）
tokio = { version = "1.42", features = ["rt", "rt-multi-thread", "macros", "time", "sync", "signal"] }

# HTTP 框架（spec §3.1 锁定）
axum = { version = "0.8", features = ["macros", "ws"] }

# HTTP 客户端（spec §3.1 锁定，关闭默认 features 以避免 openssl 依赖）
reqwest = { version = "0.12", features = ["json", "stream", "rustls-tls"], default-features = false }

# 序列化（spec §3.1 锁定）
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"

# 配置（spec §3.1 锁定）
dotenvy = "0.15"

# 日志（spec §3.1 锁定）
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# 错误处理（spec §3.1 锁定）
thiserror = "2.0"
anyhow = "1.0"

# 工具（spec §3.1 锁定）
bytes = "1.10"
http = "1.2"
http-body-util = "0.1"
uuid = { version = "1.12", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
async-trait = "0.1"
arc-swap = "1.7"
notify = "6.1"
moka = { version = "0.12", features = ["future"] }
sha2 = "0.10"
subtle = "2.6"
regex = "1.11"
tower = { version = "0.5", features = ["util", "timeout", "limit"] }
tower-http = { version = "0.6", features = ["trace", "request-id", "util"] }
hyper = { version = "1.5", features = ["server", "client", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["server", "client", "tokio"] }
futures = "0.3"
futures-util = "0.3"

# 阶段二新增（spec §3.2）
jsonwebtoken = "9.3"         # JWT 认证
serde_with = "3.7"           # 审计日志结构化

# 阶段三新增（spec §3.3）
redis = { version = "0.27", features = ["tokio-comp", "connection-manager", "cluster"] }  # 分布式限流
prometheus = "0.14"          # Prometheus 指标导出
tracing-opentelemetry = "0.28"  # OpenTelemetry tracing
opentelemetry = { version = "0.27", features = ["trace", "metrics"] }  # OpenTelemetry SDK
opentelemetry-otlp = { version = "0.27", features = ["grpc-tonic"] }  # OTLP 导出
opentelemetry_sdk = { version = "0.27", features = ["trace", "metrics"] }  # OpenTelemetry SDK
# etcd-client = "0.12"         # ETCD 配置中心 - 暂时移除，需要 protoc
wasmtime = "19.0"            # WASM 插件沙箱
async-graphql = "7.0"        # GraphQL（admin API）
async-graphql-axum = "7.0"   # GraphQL axum 集成
oauth2 = "4.4"               # OAuth2 认证

[dev-dependencies]
# 集成测试辅助
tokio = { version = "1.42", features = ["macros", "rt", "rt-multi-thread"] }
reqwest = { version = "0.12", features = ["json", "stream", "rustls-tls"], default-features = false }
serde_json = "1.0"
criterion = { version = "0.5", features = ["html_reports"] }  # 基准测试（spec §3.2）
# goose = "0.16"               # 负载测试（spec §3.3）- 暂时移除，与 tokio 1.42 冲突

[[bench]]
name = "routing_bench"
harness = false

[[bench]]
name = "proxy_bench"
harness = false
