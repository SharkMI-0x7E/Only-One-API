# Anthropic Provider 配置
# 阶段三新增（spec §2 [S3]）

provider:
  type: anthropic
  base_url: "${RGD_ANTHROPIC_BASE_URL}"
  api_key: "${RGD_ANTHROPIC_API_KEY}"
  model: "claude-3-opus-20240229"
  timeout_ms: 60000
  max_retries: 3
  max_tokens: 4096

# 支持的模型列表
models:
  - name: "claude-3-opus-20240229"
    max_tokens: 4096
  - name: "claude-3-sonnet-20240229"
    max_tokens: 4096
  - name: "claude-3-haiku-20240307"
    max_tokens: 4096
