# OpenAI Provider 配置
# 阶段三新增（spec §2 [S3]）

provider:
  type: openai
  base_url: "${RGD_OPENAI_BASE_URL}"
  api_key: "${RGD_OPENAI_API_KEY}"
  model: "gpt-4"
  timeout_ms: 60000
  max_retries: 3

# 支持的模型列表
models:
  - name: "gpt-4"
    max_tokens: 8192
  - name: "gpt-4-turbo"
    max_tokens: 128000
  - name: "gpt-3.5-turbo"
    max_tokens: 16385
