# RapidGate Kubernetes Service
# 适用版本：Kubernetes 1.28+

apiVersion: v1
kind: Service
metadata:
  name: rapidgate
  namespace: rapidgate
  labels:
    app.kubernetes.io/name: rapidgate
    app.kubernetes.io/component: gateway
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: rapidgate
    app.kubernetes.io/component: gateway
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
      # ClusterIP 端口与容器端口保持一致，避免混淆
      appProtocol: http
